name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: medos, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medos" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://medos@127.0.0.1:5432/medos_dev
      TEST_DATABASE_URL: postgresql://medos@127.0.0.1:5432/medos_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-000001
      SCRYPT_LOG_N: "12"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: psql -h 127.0.0.1 -U medos -d postgres -c "CREATE DATABASE medos_dev" -c "CREATE DATABASE medos_test"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test        # shared, API (real database), web unit tests
      - run: pnpm build
      - run: pnpm licenses:audit
      - run: pnpm audit --prod --audit-level=high

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: medos, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medos" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @medos/api build && pnpm --filter @medos/web build
      - run: pnpm --filter @medos/web exec playwright install --with-deps chromium
      # The Windows-specific e2e-prepare.ps1 is replaced by the equivalent steps on Linux:
      - run: |
          psql -h 127.0.0.1 -U medos -d postgres -c "CREATE DATABASE medos_e2e"
          DATABASE_URL=postgresql://medos@127.0.0.1:5432/medos_e2e pnpm --filter @medos/database migrate
          DATABASE_URL=postgresql://medos@127.0.0.1:5432/medos_e2e JWT_ACCESS_SECRET=e2e-only-secret-e2e-only-secret-0001 SCRYPT_LOG_N=12 SEED_PASSWORD='E2e-Passw0rd-2026!' SEED_PROFILE=small node apps/api/dist/cli/seed.js
      - run: pnpm --filter @medos/web exec playwright test
        env:
          E2E_DATABASE_URL: postgresql://medos@127.0.0.1:5432/medos_e2e
